<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0" /> -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=0.85, viewport-fit=cover"
    />
    <title>Fortress Pay</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .fp-splash {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--fp-gray-50);
      }
      .fp-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .fp-splash-logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .fp-splash-name {
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--fp-gray-900);
        letter-spacing: -0.4px;
      }
      .fp-splash-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--fp-gray-200);
        border-top-color: var(--fp-blue);
        border-radius: 50%;
        animation: fp-spin 0.7s linear infinite;
      }
    </style>
  </head>
  <body>
    <div class="fp-splash">
      <div class="fp-splash-inner">
        <div class="fp-splash-logo">
          <img
            src="assets/fortresspay-lockup.png"
            alt="Fortress Pay"
            class="fp-logo-img"
            decoding="async"
          />
        </div>
        <div class="fp-splash-spinner"></div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
      (function () {
        seedIfNeeded();
        const session = getSession();
        if (session) {
          window.location.replace("dashboard.html");
        } else {
          window.location.replace("login.html");
        }
      })();
    </script>
  </body>
</html>
