<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — Fortress Pay</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .fp-login-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 24px 0;
        color: var(--fp-gray-300);
        font-size: 0.8rem;
      }
      .fp-login-divider::before,
      .fp-login-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--fp-gray-200);
      }

      .fp-password-wrap {
        position: relative;
      }
      .fp-password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--fp-gray-400);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 4px;
        transition: color var(--fp-transition);
      }
      .fp-password-toggle:hover {
        color: var(--fp-gray-700);
      }
      .fp-password-wrap .fp-input {
        padding-right: 44px;
      }

      .fp-form-error {
        background: var(--fp-red-light);
        border: 1px solid #fca5a5;
        border-radius: var(--fp-radius-sm);
        padding: 12px 14px;
        font-size: 0.875rem;
        color: #7f1d1d;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .fp-form-error svg {
        color: var(--fp-red);
        flex-shrink: 0;
      }

      .fp-reset-notice {
        background: var(--fp-green-light);
        border: 1px solid #a7f3d0;
        border-radius: var(--fp-radius-sm);
        padding: 12px 14px;
        font-size: 0.875rem;
        color: #064e3b;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .fp-reset-notice svg {
        color: var(--fp-green);
        flex-shrink: 0;
      }

      .fp-btn-loading {
        position: relative;
        color: transparent !important;
      }
      .fp-btn-loading::after {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: fp-spin 0.65s linear infinite;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      .fp-trust-badges {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin-top: 28px;
        flex-wrap: wrap;
      }
      .fp-trust-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.75rem;
        color: var(--fp-gray-400);
        font-weight: 500;
      }
      .fp-trust-badge svg {
        color: var(--fp-gray-300);
      }

      .fp-input-with-icon {
        position: relative;
      }
      .fp-input-with-icon .fp-input {
        padding-left: 42px;
      }
      .fp-input-lead-icon {
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--fp-gray-400);
        pointer-events: none;
        display: flex;
        align-items: center;
      }

      @media (max-width: 480px) {
        .fp-login-card {
          border: none;
          box-shadow: none;
          background: transparent;
        }
      }
    </style>
  </head>
  <body>
    <div class="fp-login-page">
      <div class="fp-login-card">
        <!-- Logo -->
        <div class="fp-login-logo">
          <img
            src="assets/fortresspay-lockup.png"
            alt="Fortress Pay"
            class="fp-logo-img"
            decoding="async"
          />
        </div>

        <h1 class="fp-login-title">Welcome back</h1>
        <p class="fp-login-subtitle">Sign in to access your account.</p>

        <!-- Reset notice (shown when ?reset=1) -->
        <div class="fp-reset-notice fp-hidden" id="fp-reset-notice">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M5 13l4 4L19 7"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Account data refreshed successfully.</span>
        </div>

        <!-- Error message -->
        <div
          class="fp-form-error fp-hidden"
          id="fp-form-error"
          role="alert"
          aria-live="polite"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M12 8v4M12 16h.01"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <span id="fp-error-text"></span>
        </div>

        <!-- Login form -->
        <form id="fp-login-form" novalidate>
          <div class="fp-form-group">
            <label class="fp-label" for="fp-email">Email address</label>
            <div class="fp-input-with-icon">
              <span class="fp-input-lead-icon">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
                >
                  <path
                    d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                  <path
                    d="M22 6l-10 7L2 6"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
              </span>
              <input
                class="fp-input"
                type="email"
                id="fp-email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                inputmode="email"
                required
              />
            </div>
            <p class="fp-field-error fp-hidden" id="fp-email-error"></p>
          </div>

          <div class="fp-form-group">
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 7px;
              "
            >
              <label class="fp-label" for="fp-password" style="margin-bottom: 0"
                >Password</label
              >
            </div>
            <div class="fp-password-wrap">
              <input
                class="fp-input"
                type="password"
                id="fp-password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="fp-password-toggle"
                id="fp-pw-toggle"
                aria-label="Toggle password visibility"
              >
                <!-- Eye icon (show) -->
                <svg
                  id="fp-eye-show"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
                >
                  <path
                    d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                </svg>
                <!-- Eye-off icon (hide) -->
                <svg
                  id="fp-eye-hide"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                  aria-hidden="true"
                  class="fp-hidden"
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
            <p class="fp-field-error fp-hidden" id="fp-password-error"></p>
          </div>

          <button
            type="submit"
            class="fp-btn fp-btn-primary fp-btn-full"
            id="fp-submit-btn"
          >
            Sign In
          </button>
        </form>

        <!-- Trust badges -->
        <div class="fp-trust-badges">
          <div class="fp-trust-badge">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>256-bit SSL</span>
          </div>
          <div class="fp-trust-badge">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <rect
                x="5"
                y="11"
                width="14"
                height="10"
                rx="2"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M8 11V7a4 4 0 018 0v4"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            <span>Secure Login</span>
          </div>
          <div class="fp-trust-badge">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M5 13l4 4L19 7"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>FDIC Insured</span>
          </div>
        </div>

        <div class="fp-login-footer">
          <p>
            By signing in, you agree to our Terms of Service and Privacy Policy.
          </p>
          <p style="margin-top: 6px">
            Need assistance?
            <a
              href="support.html"
              style="color: var(--fp-blue); font-weight: 600"
              >Contact Support</a
            >
          </p>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
      (function () {
        /* ---- Seed data ---- */
        seedIfNeeded();

        /* ---- Handle ?reset=1 ---- */
        const params = new URLSearchParams(window.location.search);
        if (params.get("reset") === "1") {
          forceSeed();
          document
            .getElementById("fp-reset-notice")
            .classList.remove("fp-hidden");
          /* Clean URL */
          history.replaceState(null, "", "login.html");
        }

        /* ---- Redirect if already logged in ---- */
        if (getSession()) {
          window.location.replace("dashboard.html");
          return;
        }

        /* ---- Password visibility toggle ---- */
        const pwInput = document.getElementById("fp-password");
        const pwToggle = document.getElementById("fp-pw-toggle");
        const eyeShow = document.getElementById("fp-eye-show");
        const eyeHide = document.getElementById("fp-eye-hide");

        pwToggle.addEventListener("click", function () {
          const isPassword = pwInput.type === "password";
          pwInput.type = isPassword ? "text" : "password";
          eyeShow.classList.toggle("fp-hidden", isPassword);
          eyeHide.classList.toggle("fp-hidden", !isPassword);
          pwToggle.setAttribute(
            "aria-label",
            isPassword ? "Hide password" : "Show password",
          );
        });

        /* ---- Form helpers ---- */
        function showError(msg) {
          const box = document.getElementById("fp-form-error");
          const text = document.getElementById("fp-error-text");
          text.textContent = msg;
          box.classList.remove("fp-hidden");
        }

        function hideError() {
          document.getElementById("fp-form-error").classList.add("fp-hidden");
        }

        function setFieldError(fieldId, msg) {
          const el = document.getElementById(fieldId);
          if (!el) return;
          el.textContent = msg;
          el.classList.toggle("fp-hidden", !msg);
          const input = document.getElementById(fieldId.replace("-error", ""));
          if (input) input.classList.toggle("fp-input-error", !!msg);
        }

        function clearFieldErrors() {
          setFieldError("fp-email-error", "");
          setFieldError("fp-password-error", "");
          hideError();
        }

        function setLoading(on) {
          const btn = document.getElementById("fp-submit-btn");
          btn.disabled = on;
          btn.classList.toggle("fp-btn-loading", on);
        }

        /* ---- Form submission ---- */
        const form = document.getElementById("fp-login-form");

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          clearFieldErrors();

          const email = document.getElementById("fp-email").value.trim();
          const password = document.getElementById("fp-password").value;

          let valid = true;

          if (!email) {
            setFieldError("fp-email-error", "Please enter your email address.");
            valid = false;
          } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            setFieldError(
              "fp-email-error",
              "Please enter a valid email address.",
            );
            valid = false;
          }

          if (!password) {
            setFieldError("fp-password-error", "Please enter your password.");
            valid = false;
          }

          if (!valid) return;

          setLoading(true);

          login(email, password)
            .then(function () {
              window.location.href = "dashboard.html";
            })
            .catch(function (err) {
              setLoading(false);
              showError(
                err.message ||
                  "An unexpected error occurred. Please try again.",
              );
            });
        });

        /* ---- Clear errors on input ---- */
        document
          .getElementById("fp-email")
          .addEventListener("input", function () {
            setFieldError("fp-email-error", "");
            hideError();
          });
        document
          .getElementById("fp-password")
          .addEventListener("input", function () {
            setFieldError("fp-password-error", "");
            hideError();
          });
      })();
    </script>
  </body>
</html>
