<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0" /> -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=0.85, viewport-fit=cover"
    />
    <title>Transaction Detail — Fortress Pay</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .fp-txn-detail-card {
        background: var(--fp-white);
        border-radius: var(--fp-radius-lg);
        border: 1px solid var(--fp-gray-200);
        box-shadow: var(--fp-shadow-md);
        overflow: hidden;
        margin-bottom: 20px;
      }

      .fp-txn-hero {
        text-align: center;
        padding: 36px 24px 28px;
        border-bottom: 1px solid var(--fp-gray-100);
        background: linear-gradient(
          160deg,
          var(--fp-gray-50) 0%,
          var(--fp-white) 100%
        );
      }

      .fp-txn-hero-icon {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        background: var(--fp-green-light);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--fp-green);
        margin: 0 auto 18px;
        box-shadow: 0 0 0 8px rgba(5, 150, 105, 0.08);
      }

      .fp-txn-hero-type {
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--fp-green);
        margin-bottom: 8px;
      }

      .fp-txn-hero-amount {
        font-size: 2.6rem;
        font-weight: 800;
        color: var(--fp-gray-900);
        letter-spacing: -1.5px;
        line-height: 1.1;
        margin-bottom: 10px;
      }

      .fp-txn-hero-amount span.plus {
        color: var(--fp-green);
      }

      .fp-txn-hero-date {
        font-size: 0.875rem;
        color: var(--fp-gray-500);
      }

      .fp-txn-status-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 14px;
      }

      .fp-detail-section {
        padding: 20px;
        border-bottom: 1px solid var(--fp-gray-100);
      }
      .fp-detail-section:last-child {
        border-bottom: none;
      }

      .fp-detail-section-title {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--fp-gray-400);
        margin-bottom: 14px;
      }

      .fp-detail-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 10px 0;
        border-bottom: 1px solid var(--fp-gray-50);
        gap: 16px;
      }
      .fp-detail-row:last-child {
        border-bottom: none;
      }

      .fp-detail-label {
        font-size: 0.84rem;
        color: var(--fp-gray-500);
        font-weight: 500;
        flex-shrink: 0;
      }

      .fp-detail-value {
        font-size: 0.9rem;
        color: var(--fp-gray-900);
        font-weight: 600;
        text-align: right;
        word-break: break-word;
      }

      .fp-detail-value.mono {
        font-family: "SF Mono", "Fira Mono", "Courier New", monospace;
        font-size: 0.83rem;
        letter-spacing: 0.3px;
      }

      /* Print button */
      .fp-print-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--fp-gray-600);
        padding: 8px 14px;
        border-radius: var(--fp-radius-sm);
        border: 1.5px solid var(--fp-gray-200);
        background: var(--fp-white);
        transition:
          background var(--fp-transition),
          border-color var(--fp-transition);
      }
      .fp-print-btn:hover {
        background: var(--fp-gray-100);
        border-color: var(--fp-gray-300);
      }

      /* Error state */
      .fp-txn-error-card {
        background: var(--fp-white);
        border-radius: var(--fp-radius-lg);
        border: 1px solid var(--fp-gray-200);
        box-shadow: var(--fp-shadow);
        padding: 48px 24px;
        text-align: center;
      }
      .fp-txn-error-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--fp-gray-100);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--fp-gray-400);
        margin: 0 auto 20px;
      }
      .fp-txn-error-title {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--fp-gray-800);
        margin-bottom: 8px;
      }
      .fp-txn-error-text {
        font-size: 0.875rem;
        color: var(--fp-gray-500);
        line-height: 1.6;
        margin-bottom: 24px;
      }

      /* Skeleton states */
      .fp-txn-hero-sk {
        padding: 36px 24px 28px;
        border-bottom: 1px solid var(--fp-gray-100);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      @media print {
        #fp-header,
        #fp-bottom-nav,
        .fp-back-btn,
        .fp-print-btn,
        .fp-page-header {
          display: none !important;
        }
        .fp-page {
          padding-top: 0;
          padding-bottom: 0;
        }
        .fp-txn-detail-card {
          box-shadow: none;
          border: 1px solid #ccc;
        }
      }
    </style>
  </head>
  <body>
    <div id="fp-header"></div>

    <main class="fp-page">
      <div class="fp-container">
        <!-- Page header -->
        <div class="fp-page-header">
          <a
            href="activity.html"
            class="fp-back-btn"
            aria-label="Back to activity"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M19 12H5M5 12l7 7M5 12l7-7"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
          <div style="flex: 1">
            <h1 class="fp-page-title">Transaction Detail</h1>
            <p class="fp-page-subtitle" id="fp-txn-ref-sub">
              Loading reference...
            </p>
          </div>
          <button
            class="fp-print-btn"
            onclick="window.print()"
            aria-label="Print transaction"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Print
          </button>
        </div>

        <!-- Content -->
        <div id="fp-txn-content">
          <!-- Skeleton -->
          <div class="fp-txn-detail-card" id="fp-txn-skeleton">
            <div class="fp-txn-hero-sk">
              <div
                class="fp-skeleton"
                style="width: 68px; height: 68px; border-radius: 50%"
              ></div>
              <div
                class="fp-skeleton"
                style="width: 60px; height: 14px; border-radius: 4px"
              ></div>
              <div
                class="fp-skeleton"
                style="width: 200px; height: 40px; border-radius: 6px"
              ></div>
              <div
                class="fp-skeleton"
                style="width: 140px; height: 14px; border-radius: 4px"
              ></div>
            </div>
            <div class="fp-detail-section">
              ${[...Array(4)].map(() => `
              <div class="fp-detail-row">
                <div
                  class="fp-skeleton"
                  style="width: 110px; height: 13px; border-radius: 4px"
                ></div>
                <div
                  class="fp-skeleton"
                  style="width: 150px; height: 13px; border-radius: 4px"
                ></div>
              </div>
              `).join("")}
            </div>
          </div>
        </div>
      </div>
    </main>

    <nav id="fp-bottom-nav"></nav>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>

            "txn.err.back": "返回交易记录",
            "txn.err.noId.title": "未指定交易",
            "txn.err.noId.msg": "查看此页面需要交易ID。请从交易记录列表进入。",

            "txn.err.notFound.msg":
              "该交易不存在或已被移除。请返回交易记录列表查看。",

            "txn.docTitle.default": "交易详情 — Fortress Pay",
            "txn.docTitle.withRef": "交易 {ref} — Fortress Pay",

            "txn.status.completed": "已完成",

            "txn.section.amountMethod": "金額與方式",
            "txn.section.sender": "付款方資訊",
            "txn.section.recipient": "收款帳戶",

            "txn.label.reference": "參考號",
            "txn.label.txnId": "交易ID",
            "txn.label.date": "日期",
            "txn.label.time": "時間",
            "txn.label.status": "狀態",
            "txn.label.type": "類型",

            "txn.label.amount": "金額",
            "txn.label.currency": "幣別",
            "txn.label.method": "方式",
            "txn.label.memo": "備註",

            "txn.label.senderName": "付款方姓名",
            "txn.label.senderAccount": "付款方帳戶",
            "txn.label.transferMethod": "轉帳方式",

            "txn.label.accountType": "帳戶類型",
            "txn.label.accountNo": "帳戶號碼",

            "txn.notice.prefix": "如需下載此交易的正式紀錄，請",
            "txn.notice.linkText": "申請帳戶對帳單",
            "txn.notice.suffix": "。",

            "txn.err.back": "返回交易記錄",
            "txn.err.noId.title": "未指定交易",
            "txn.err.noId.msg": "查看此頁面需要交易ID。請從交易記錄列表進入。",
            "txn.err.notFound.title": "未找到交易",
            "txn.err.notFound.msg":
              "該交易不存在或已被移除。請返回交易記錄列表查看。",

            "txn.docTitle.default": "交易詳情 — Fortress Pay",
            "txn.docTitle.withRef": "交易 {ref} — Fortress Pay",

            "txn.status.completed": "已完成",
            "txn.status.processing": "處理中",
            "txn.status.failed": "失敗",
          },
        });

        /* ================================================================ */
        /*  State                                                            */
        /* ================================================================ */
        var state = {
          txnId: "",
          txn: null,
          user: null,
          error: null, // { titleKey, msgKey, msgRaw }
        };

        /* ================================================================ */
        /*  Helpers                                                          */
        /* ================================================================ */
        function fmt(template, vars) {
          return String(template || "").replace(/\{(\w+)\}/g, function (_, k) {
            return vars && vars[k] != null ? String(vars[k]) : "";
          });
        }

        function localeForLang() {
          var lang = getLang() || "en";
          if (lang === "zh-Hans") return "zh-CN";
          if (lang === "zh-Hant") return "zh-TW";
          return "en-US";
        }

        function setAttr(sel, attr, key, fallback) {
          var el = document.querySelector(sel);
          if (!el) return;
          var fb = fallback != null ? fallback : el.getAttribute(attr) || "";
          el.setAttribute(attr, t(key, fb));
        }

        function setText(sel, key, fallback) {
          var el = document.querySelector(sel);
          if (!el) return;
          el.textContent = t(key, fallback != null ? fallback : el.textContent);
        }

        // For elements containing SVG + a text node (button/link)
        function setSvgText(el, key, fallback) {
          if (!el) return;
          var tn = Array.from(el.childNodes).find(function (n) {
            return n.nodeType === 3 && n.textContent.trim();
          });
          var txt = " " + t(key, fallback || "").trim();
          if (tn) tn.textContent = txt;
          else el.appendChild(document.createTextNode(txt));
        }

        function translateStatus(raw) {
          var s = String(raw || "").trim();
          if (!s) return s;
          if (s === "Completed") return t("txn.status.completed", s);
          if (s === "Processing") return t("txn.status.processing", s);
          if (s === "Failed") return t("txn.status.failed", s);
          return s;
        }

        function formatMoneyUSD(amount) {
          return new Intl.NumberFormat(localeForLang(), {
            style: "currency",
            currency: "USD",
            minimumFractionDigits: 2,
          }).format(amount);
        }

        /* ================================================================ */
        /*  Render                                                           */
        /* ================================================================ */
        function applyStaticText() {
          setAttr(
            ".fp-back-btn",
            "aria-label",
            "txn.backAria",
            "Back to activity",
          );
          setText(".fp-page-title", "txn.title", "Transaction Detail");

          // subtitle defaults only if txn not loaded
          if (!state.txn && !state.error) {
            setText(
              "#fp-txn-ref-sub",
              "txn.ref.loading",
              "Loading reference...",
            );
          }

          setAttr(
            ".fp-print-btn",
            "aria-label",
            "txn.printAria",
            "Print transaction",
          );
          setSvgText(
            document.querySelector(".fp-print-btn"),
            "txn.print",
            "Print",
          );
        }

        function renderError() {
          var sub = document.getElementById("fp-txn-ref-sub");
          if (sub) sub.textContent = t("txn.ref.notFound", "Not found");

          document.title = t(
            "txn.docTitle.default",
            "Transaction Detail — Fortress Pay",
          );

          var title =
            state.error && state.error.titleKey ? t(state.error.titleKey) : "";
          var msg = "";

          if (state.error) {
            if (state.error.msgRaw) msg = state.error.msgRaw;
            else if (state.error.msgKey) msg = t(state.error.msgKey);
          }

          document.getElementById("fp-txn-content").innerHTML =
            '<div class="fp-txn-error-card">' +
            '<div class="fp-txn-error-icon">' +
            '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
            '<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>' +
            '<path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
            "</svg>" +
            "</div>" +
            '<p class="fp-txn-error-title">' +
            title +
            "</p>" +
            '<p class="fp-txn-error-text">' +
            msg +
            "</p>" +
            '<a href="activity.html" class="fp-btn fp-btn-primary">' +
            t("txn.err.back", "Back to Activity") +
            "</a>" +
            "</div>";
        }

        function renderRecipientRows() {
          var wrap = document.getElementById("fp-recip-rows");
          if (!wrap) return;

          if (!state.user) {
            // keep skeleton as is (already in HTML we inject)
            return;
          }

          wrap.innerHTML =
            '<div class="fp-detail-row">' +
            '<span class="fp-detail-label">' +
            t("txn.label.accountType", "Account Type") +
            "</span>" +
            '<span class="fp-detail-value">' +
            (state.user.accountType || "") +
            "</span>" +
            "</div>" +
            '<div class="fp-detail-row">' +
            '<span class="fp-detail-label">' +
            t("txn.label.accountNo", "Account No.") +
            "</span>" +
            '<span class="fp-detail-value mono">' +
            (state.user.accountNumber || "") +
            "</span>" +
            "</div>";
        }

        function renderTransaction() {
          var tx = state.txn;
          if (!tx) return;

          // Title
          document.title = fmt(
            t("txn.docTitle.withRef", "Transaction {ref} — Fortress Pay"),
            {
              ref: tx.reference,
            },
          );

          // Reference subtitle
          var sub = document.getElementById("fp-txn-ref-sub");
          if (sub)
            sub.textContent = t("txn.ref.prefix", "Ref: ") + tx.reference;

          var amt = formatMoneyUSD(tx.amount);
          var statusText = translateStatus(tx.status);

          document.getElementById("fp-txn-content").innerHTML =
            '<div class="fp-txn-detail-card">' +
            '<div class="fp-txn-hero">' +
            '<div class="fp-txn-hero-icon">' +
            '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
            '<path d="M12 5v14M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
            "</svg>" +
            "</div>" +
            '<p class="fp-txn-hero-type">' +
            t("txn.hero.creditReceived", "Credit Received") +
            "</p>" +
            '<p class="fp-txn-hero-amount"><span class="plus">+</span>' +
            amt +
            "</p>" +
            '<p class="fp-txn-hero-date">' +
            tx.date +
            " " +
            t("txn.hero.at", "at") +
            " " +
            tx.time +
            "</p>" +
            '<div class="fp-txn-status-row">' +
            '<span class="fp-badge-status fp-badge-completed">' +
            statusText +
            "</span>" +
            "</div>" +
            "</div>" +
            '<div class="fp-detail-section">' +
            '<p class="fp-detail-section-title">' +
            t("txn.section.info", "Transaction Information") +
            "</p>" +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.reference", "Reference") +
            '</span><span class="fp-detail-value mono">' +
            tx.reference +
            "</span></div>" +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.txnId", "Transaction ID") +
            '</span><span class="fp-detail-value mono">' +
            tx.id +
            "</span></div>" +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.date", "Date") +
            '</span><span class="fp-detail-value">' +
            tx.date +
            "</span></div>" +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.time", "Time") +
            '</span><span class="fp-detail-value">' +
            tx.time +
            " UTC</span></div>" +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.status", "Status") +
            '</span><span class="fp-detail-value"><span class="fp-badge-status fp-badge-completed">' +
            statusText +
            "</span></span></div>" +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.type", "Type") +
            '</span><span class="fp-detail-value">' +
            (tx.type || "") +
            "</span></div>" +
            "</div>" +
            '<div class="fp-detail-section">' +
            '<p class="fp-detail-section-title">' +
            t("txn.section.amountMethod", "Amount & Method") +
            "</p>" +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.amount", "Amount") +
            '</span><span class="fp-detail-value" style="color:var(--fp-green);font-size:1rem;">+' +
            amt +
            "</span></div>" +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.currency", "Currency") +
            '</span><span class="fp-detail-value">' +
            (tx.currency || "") +
            "</span></div>" +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.method", "Method") +
            '</span><span class="fp-detail-value">' +
            (tx.method || "") +
            "</span></div>" +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.memo", "Memo") +
            '</span><span class="fp-detail-value">' +
            (tx.memo || "") +
            "</span></div>" +
            "</div>" +
            '<div class="fp-detail-section">' +
            '<p class="fp-detail-section-title">' +
            t("txn.section.sender", "Sender Details") +
            "</p>" +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.senderName", "Sender Name") +
            '</span><span class="fp-detail-value">' +
            (tx.sender || "") +
            "</span></div>" +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.senderAccount", "Sender Account") +
            '</span><span class="fp-detail-value mono">' +
            (tx.senderAccount || "") +
            "</span></div>" +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.transferMethod", "Transfer Method") +
            '</span><span class="fp-detail-value">' +
            (tx.method || "") +
            "</span></div>" +
            "</div>" +
            '<div class="fp-detail-section">' +
            '<p class="fp-detail-section-title">' +
            t("txn.section.recipient", "Recipient Account") +
            "</p>" +
            '<div id="fp-recip-rows">' +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.accountType", "Account Type") +
            '</span><span class="fp-detail-value fp-skeleton" style="width:160px;height:14px;border-radius:4px;">&nbsp;</span></div>' +
            '<div class="fp-detail-row"><span class="fp-detail-label">' +
            t("txn.label.accountNo", "Account No.") +
            '</span><span class="fp-detail-value fp-skeleton" style="width:130px;height:14px;border-radius:4px;">&nbsp;</span></div>' +
            "</div>" +
            "</div>" +
            "</div>" +
            '<div class="fp-alert fp-alert-info" style="margin-bottom:20px;">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
            '<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>' +
            '<path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
            "</svg>" +
            "<span>" +
            t(
              "txn.notice.prefix",
              "To download a formal record of this transaction, please",
            ) +
            ' <a href="statements.html" style="font-weight:700;text-decoration:underline;">' +
            t("txn.notice.linkText", "request an account statement") +
            "</a>" +
            t("txn.notice.suffix", ".") +
            "</span>" +
            "</div>";

          renderRecipientRows();
        }

        function renderAll() {
          applyStaticText();

          if (state.error) {
            renderError();
            return;
          }

          if (state.txn) {
            renderTransaction();
            return;
          }

          // else: still loading, keep skeleton
          document.title = t(
            "txn.docTitle.default",
            "Transaction Detail — Fortress Pay",
          );
        }

        /* ================================================================ */
        /*  Init                                                             */
        /* ================================================================ */
        var params = new URLSearchParams(window.location.search);
        state.txnId = params.get("id") || "";

        renderAll();

        if (!state.txnId) {
          state.error = {
            titleKey: "txn.err.noId.title",
            msgKey: "txn.err.noId.msg",
            msgRaw: "",
          };
          renderAll();
          return;
        }

        getTransactionById(state.txnId)
          .then(function (tx) {
            state.txn = tx;
            renderAll();

            // Fill recipient account info async
            return getUser();
          })
          .then(function (u) {
            state.user = u;
            renderRecipientRows();
          })
          .catch(function (err) {
            state.error = {
              titleKey: "txn.err.notFound.title",
              msgKey: err && err.message ? "" : "txn.err.notFound.msg",
              msgRaw: err && err.message ? err.message : "",
            };
            renderAll();
          });

        /* Live update without reload */
        window.addEventListener("fp:langchange", function () {
          renderAll();
        });
      })();
    </script>
  </body>
</html>
